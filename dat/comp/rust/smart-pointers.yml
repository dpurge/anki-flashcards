- Q: |
    Can you dereference a `Box<T>` the same way you dereference an `&T` reference?
  A: |
    Yes — `*y` works the same whether `y` is a `Box<i32>` or an `&i32`, accessing the value the box/reference points to.
  C: |
    let x = 5;
    let y = Box::new(x);
    assert_eq!(5, *y);

- Q: |
    What does implementing `Deref` for a custom wrapper type require, and what does its `deref` method's signature look like?
  A: |
    `type Target` declares what type dereferencing produces, and `fn deref(&self) -> &Self::Target` returns a reference to the inner value — not the value itself.
  C: |
    struct MyBox<T>(T);

    impl<T> Deref for MyBox<T> {
        type Target = T;
        fn deref(&self) -> &Self::Target {
            &self.0
        }
    }

- Q: |
    What does `*y` actually expand to behind the scenes when `y`'s type implements `Deref`?
  A: |
    `*(y.deref())` — the `*` operator calls `.deref()` to get a reference to the inner value, then dereferences that reference.

- Q: |
    Why does `Deref::deref` return `&Self::Target` (a reference) instead of returning `Self::Target` (the value) directly?
  A: |
    Returning the value directly would move it out of `self`, transferring ownership out of the smart pointer — which would violate the point of a smart pointer wrapping/owning that data. Returning a reference lets you access the inner value without taking ownership of it.

- Q: |
    What is "deref coercion", and how does it let `fn hello(name: &str)` accept a `&MyBox<String>` argument directly?
  A: |
    Deref coercion automatically converts a reference to a type implementing `Deref` into a reference to that type's `Target`, and can chain through multiple layers. `&MyBox<String>` coerces to `&String` (via `MyBox`'s `Deref`), which further coerces to `&str` (via `String`'s own `Deref`) — so `hello(&m)` works without manual dereferencing.
  C: |
    fn hello(name: &str) {
        println!("Hello, {name}!");
    }
    let m = MyBox::new(String::from("Rust"));
    hello(&m); // &MyBox<String> -> &String -> &str

- Q: |
    Without deref coercion, what would you have to write manually to pass a `MyBox<String>` reference to a function expecting `&str`?
  A: |
    `hello(&(*m)[..])` — explicitly dereference the box, then slice the resulting `String` into a `&str`.

- Q: |
    Does deref coercion impose any runtime cost?
  A: |
    No — the compiler resolves exactly how many `Deref::deref` calls are needed at compile time, so there's no cost paid when the program actually runs.

- Q: |
    What is `DerefMut`, and what does it enable that `Deref` alone does not?
  A: |
    `DerefMut` is the mutable counterpart to `Deref`, overriding `*` for mutable references/contexts so a smart pointer can be dereferenced to produce a mutable reference to its inner value, not just an immutable one.

- Q: |
    What are the three cases Rust's deref coercion covers, and which conversion direction is *not* allowed?
  A: |
    `&T` to `&U` when `T: Deref<Target=U>`; `&mut T` to `&mut U` when `T: DerefMut<Target=U>`; and `&mut T` to `&U` when `T: Deref<Target=U>`. The reverse — coercing an immutable reference into a mutable one — is not allowed, since an immutable reference doesn't guarantee it's the only reference to that data.

- Q: |
    What does implementing the `Drop` trait let you do, and what is its method's signature?
  A: |
    It lets you customize cleanup code (e.g. releasing a file handle or network connection) that runs automatically when a value is about to go out of scope. The trait requires one method, `fn drop(&mut self)`, taking a mutable reference to `self`.

- Q: |
    If two values go out of scope at the end of the same block, in what order does Rust call their `Drop::drop` implementations?
  A: |
    In the reverse order of their creation — the most recently created value is dropped first.

- Q: |
    Why does calling `c.drop()` directly produce a compile error ("explicit use of destructor method"), instead of just running cleanup early?
  A: |
    Rust will still automatically call `drop` on `c` again when it goes out of scope at the end of its scope, regardless of any manual call — allowing an explicit call would let the value be dropped twice, causing a double free. The compiler forbids explicit `.drop()` calls entirely to prevent this.

- Q: |
    How do you force a value to be cleaned up early (before its scope naturally ends), given that calling `.drop()` directly is forbidden?
  A: |
    Call the standalone `std::mem::drop` function (in the prelude), passing the value by value: `drop(c);`. Because it takes ownership of its argument, the value is moved into the function and dropped there — the compiler then knows `c` is gone and won't try to drop it again at the end of its original scope.
  C: |
    drop(c); // std::mem::drop, not Drop::drop

- Q: |
    Why does a naive `Box<List>`-based cons list fail to compile once two lists (`b` and `c`) both try to share the same tail `a`?
  A: |
    `Box<T>` enforces single ownership — the first list that takes ownership of `a` (e.g. `b`) moves it, so building `c` from `a` afterward fails with "use of moved value". `Box` alone can't express "multiple things share ownership of this same data."
  C: |
    let a = Cons(5, Box::new(Cons(10, Box::new(Nil))));
    let b = Cons(3, Box::new(a)); // a moved here
    let c = Cons(4, Box::new(a)); // error: use of moved value `a`

- Q: |
    Why is `Rc::clone(&a)` idiomatically preferred over calling `a.clone()` directly, even though both compile to the same call?
  A: |
    `Rc::clone` makes it visually obvious at the call site that this is a cheap reference-count increment, not a deep data copy — so when hunting for performance problems, you can immediately disregard `Rc::clone` calls and focus on genuinely expensive `.clone()` calls elsewhere.
  C: |
    let b = Cons(3, Rc::clone(&a));
    let c = Cons(4, Rc::clone(&a));

- Q: |
    What does `Rc::strong_count(&a)` tell you, and how does it change as clones are created and dropped?
  A: |
    The current number of owners sharing that `Rc`'s data. It increments by one on each `Rc::clone`, and decrements automatically (via `Rc`'s `Drop` implementation) whenever one of those owning `Rc` values goes out of scope; the underlying data is only cleaned up once the count reaches zero.
  C: |
    let a = Rc::new(Cons(5, Rc::new(Nil)));
    println!("{}", Rc::strong_count(&a)); // 1
    let b = Cons(3, Rc::clone(&a));
    println!("{}", Rc::strong_count(&a)); // 2

- Q: |
    What kind of access does `Rc<T>` give its multiple owners — can any of them mutate the shared data?
  A: |
    No — `Rc<T>` only provides shared *immutable* access; all owners can read the data, but none can mutate it through the `Rc` alone, since allowing multiple simultaneous mutable borrows would risk data races.

- Q: |
    Can `Rc<T>` be safely shared across multiple threads?
  A: |
    No — `Rc<T>`'s reference counting isn't atomic, so it's only safe for single-threaded use; multithreaded reference counting needs a different type (covered separately, e.g. `Arc<T>`).

- Q: |
    What is "interior mutability", and how does `RefCell<T>` implement it safely?
  A: |
    Interior mutability is a pattern that lets you mutate data even through an immutable reference/binding to it — normally forbidden by the borrow checker. `RefCell<T>` achieves this by moving the borrowing-rule check from compile time to runtime, using `unsafe` code internally but wrapping it in a safe public API.

- Q: |
    What is the key difference in *when* borrowing violations are caught for plain references/`Box<T>` versus `RefCell<T>`?
  A: |
    References and `Box<T>` have their borrowing rules enforced at compile time — a violation is a compiler error. `RefCell<T>` enforces the same rules (one mutable OR many immutable borrows at a time) at runtime instead — a violation compiles fine but panics when the offending code actually runs.

- Q: |
    Summarize the ownership/mutability differences between `Box<T>`, `Rc<T>`, and `RefCell<T>`.
  A: |
    `Box<T>` and `RefCell<T>` have a single owner; `Rc<T>` allows multiple owners. `Box<T>` allows immutable or mutable borrows, checked at compile time. `Rc<T>` allows only immutable borrows, checked at compile time. `RefCell<T>` allows immutable or mutable borrows, but checked at runtime — which is what lets you mutate data inside a `RefCell<T>` even when the `RefCell<T>` binding itself is immutable.

- Q: |
    In the mock-object testing pattern, why does a `Messenger` implementation need `RefCell<Vec<String>>` instead of a plain `Vec<String>` field to record sent messages?
  A: |
    The `Messenger` trait's `send(&self, ...)` method only takes `&self`, an immutable reference, so a plain `Vec` field couldn't be mutated inside it. Wrapping it in `RefCell` lets `send` call `.borrow_mut()` to push a new message despite only having `&self`.
  C: |
    struct MockMessenger {
        sent_messages: RefCell<Vec<String>>,
    }
    impl Messenger for MockMessenger {
        fn send(&self, message: &str) {
            self.sent_messages.borrow_mut().push(String::from(message));
        }
    }

- Q: |
    What do `RefCell<T>`'s `.borrow()` and `.borrow_mut()` methods return, and why can you use those return values like ordinary references?
  A: |
    `.borrow()` returns a `Ref<T>` (a tracked immutable borrow); `.borrow_mut()` returns a `RefMut<T>` (a tracked mutable borrow). Both implement `Deref`, so they behave like `&T`/`&mut T` for most purposes, while `RefCell` tracks how many of each are currently outstanding.
  C: |
    assert_eq!(mock_messenger.sent_messages.borrow().len(), 1);

- Q: |
    What happens at runtime if code calls `.borrow_mut()` twice on the same `RefCell<T>` while both resulting `RefMut`s are still alive?
  A: |
    The program panics with a message like "already borrowed" — `RefCell<T>` tracks active `Ref`/`RefMut` counts and enforces the same "one mutable XOR many immutable" rule as the compiler would, just discovered at runtime instead of compile time.

- Q: |
    Why is `Rc<RefCell<T>>` a common combination, and what does it let you do that neither type alone can?
  A: |
    `Rc<T>` alone only gives shared, read-only access to its data (multiple owners, no mutation). Wrapping the inner value in `RefCell<T>` adds interior mutability, so `Rc<RefCell<T>>` gives you multiple owners that can each mutate the shared data — mutating it through any one owner is visible through all the others.
  C: |
    let value = Rc::new(RefCell::new(5));
    let a = Rc::new(Cons(Rc::clone(&value), Rc::new(Nil)));
    *value.borrow_mut() += 10; // visible through every Rc pointing at `value`

- Q: |
    What happens if you try to use `RefCell<T>` across multiple threads, and what's the thread-safe equivalent?
  A: |
    `RefCell<T>` is single-threaded only and produces a compile-time error if used in a multithreaded context (it doesn't implement the required thread-safety traits). `Mutex<T>` is the thread-safe counterpart that provides the equivalent runtime-checked interior mutability across threads.

- Q: |
    Does Rust's ownership/borrow-checker system guarantee your program can never leak memory?
  A: |
    No — Rust guarantees memory *safety* (no use-after-free, no data races, etc.), but a memory leak isn't a memory-safety violation, so it's still possible to leak memory, e.g. by creating a reference cycle with `Rc<RefCell<T>>`.

- Q: |
    How can two `Rc<RefCell<T>>` nodes end up in a reference cycle that leaks memory, and why doesn't dropping them free the memory?
  A: |
    If node `a` holds a strong `Rc` to node `b`, and `b`'s internal `RefCell` is mutated to hold a strong `Rc` back to `a`, each node's strong count is now 2 (one from the original variable, one from the other node's pointer). When both variables go out of scope, each count only drops to 1 — never reaching 0 — so neither node's `Drop` ever runs and both leak.
  C: |
    let a = Rc::new(Cons(5, RefCell::new(Rc::new(Nil))));
    let b = Rc::new(Cons(10, RefCell::new(Rc::clone(&a))));
    *a.tail().unwrap().borrow_mut() = Rc::clone(&b); // a -> b -> a cycle

- Q: |
    What is a `Weak<T>` reference, how do you create one, and how does it differ from a strong `Rc<T>` reference regarding ownership?
  A: |
    Call `Rc::downgrade(&some_rc)` to get a `Weak<T>` pointing at the same data. Unlike a strong reference (which expresses shared ownership and keeps the value alive), a weak reference expresses no ownership — its count doesn't affect whether the value gets dropped.

- Q: |
    What's the difference between an `Rc<T>`'s `strong_count` and its `weak_count`, and which one determines when the value is dropped?
  A: |
    `strong_count` tracks owning `Rc<T>` references and must reach 0 for the value to be dropped. `weak_count` tracks `Weak<T>` references created via `Rc::downgrade` — it has no bearing on whether the value is dropped, so weak references alone can never keep data alive or create a leaking cycle.

- Q: |
    Since the value a `Weak<T>` points to might already have been dropped, how do you safely access it?
  A: |
    Call `.upgrade()` on the `Weak<T>`, which returns `Option<Rc<T>>` — `Some(rc)` if the value is still alive (also bumping the strong count for as long as you hold that `Rc`), or `None` if it's already been dropped.

- Q: |
    In a parent/child tree (each `Node` has `children: RefCell<Vec<Rc<Node>>>` and `parent: RefCell<Weak<Node>>`), why is the parent link `Weak` while the children links are strong `Rc`?
  A: |
    A parent should own its children — dropping the parent should drop them too, which strong `Rc` children links provide. But a child shouldn't own its parent — dropping a child shouldn't affect whether the parent still exists, and a strong link back up would create a reference cycle; a `Weak` parent link avoids that while still letting a child look up its parent when needed.
  C: |
    struct Node {
        value: i32,
        parent: RefCell<Weak<Node>>,
        children: RefCell<Vec<Rc<Node>>>,
    }