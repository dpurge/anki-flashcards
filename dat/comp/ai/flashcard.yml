deck:
  name: 'Computer::AI'

model:
  name: Computer QA
  kind: normal
  style:
    css: ../_model/comp-qa.css
  templates:
    - name: Computer QA
      qfmt: ../_model/comp-qfmt.html
      afmt: ../_model/comp-afmt.html
  fields:
    - name: Q
      template: ../_template/Question.txt
      index: true
      format: markdown
      description: Question
    - name: A
      template: ../_template/Answer.txt
      format: markdown
      description: Answer
    - name: C
      template: ../_template/Code.txt
      description: Code
    - name: N
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

