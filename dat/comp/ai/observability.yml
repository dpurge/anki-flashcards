- Q: |
    What happens to agents without runtime observability?
  A: |
    "Without observability, agents make decisions under uncertainty, evaluations become subjective judgments, and retries become blind wandering."

- Q: |
    List the four systemic problems caused by missing observability.
  A: |
    1) Cannot distinguish "correct" from "appears correct," 2) evaluation becomes mysticism, 3) retries become blind guesses, 4) session handoff information cliff.

- Q: |
    Why can't agents distinguish "correct" from "appears correct" without observability?
  A: |
    Runtime behavior can diverge from what code inspection suggests — code review reveals intent, but execution traces reveal actual behavior paths, and boundary-condition errors only manifest during execution under specific inputs.

- Q: |
    Why does evaluation "become mysticism" without observability?
  A: |
    Without scoring rubrics and acceptance criteria, evaluators rely on implicit assumptions, so the same output gets vastly different assessments depending on who evaluates it — quality determination becomes non-reproducible.

- Q: |
    How much of total session time does redundant diagnosis consume at a session handoff, per Anthropic's observations?
  A: |
    30-50% of total session time.

- Q: |
    What are the two essential observability layers, and what question does each answer?
  A: |
    Runtime Observability (system-level signals — logs, traces, process events, health checks) answers "what did the system do." Process Observability (harness decision artifacts — plans, scoring rubrics, acceptance criteria) answers "why should this change be accepted."

- Q: |
    What is a "Task Trace"?
  A: |
    A complete decision-path record from task start to completion, analogous to request tracing in distributed systems — every agent action and its context is recorded for full replay capability.

- Q: |
    What is a "Sprint Contract"?
  A: |
    A short-term agreement negotiated before coding begins, specifying task scope, verification standards, and explicit exclusions — it transforms implicit expectations into an explicit agreement.

- Q: |
    What is an "Evaluator Rubric"?
  A: |
    A structured scoring framework with defined dimensions and thresholds that converts subjective quality judgments into reproducible, evidence-backed assessments.

- Q: |
    Why can't agents self-solve the observability problem? Name the three reasons.
  A: |
    1) The "unknown unknowns" problem — agents don't proactively record signals they don't realize they need. 2) Format inconsistency — different sessions produce different log formats, preventing systematic analysis. 3) Process artifacts (sprint contracts, scoring rubrics) can't be self-generated by simple agent logging; they need harness-level structural support.

- Q: |
    In the dark mode feature example, how did efficiency compare with vs. without observability?
  A: |
    Without observability: vague planner output → ambiguous implementation → subjective rejection → blind retries → ~45 minutes to an acceptable result. With full observability: detailed sprint contract → structured implementation against explicit standards → evidence-based evaluation → single-iteration quality result → ~15 minutes. A 3x efficiency improvement.

- Q: |
    What four steps make up an observability implementation framework for an agent harness?
  A: |
    1) Runtime signal collection, 2) sprint contracts, 3) evaluator rubrics, 4) OpenTelemetry standardization.

- Q: |
    What does a scored evaluator rubric matrix look like structurally?
  A: |
    Columns represent quality levels (A, B, C, D), rows represent evaluation dimensions (e.g. code correctness, architecture, test coverage), and each cell contains a specific evidence threshold for that dimension/level.

- Q: |
    How should OpenTelemetry traces be structured for an agent harness?
  A: |
    Create traces for harness sessions, spans for individual tasks, and sub-spans for verification steps, using standard attributes to annotate key information — enabling integration with standard tools like Jaeger and Zipkin.

- Q: |
    Describe Anthropic's March 2026 three-agent architecture experiment for building a browser-based DAW, including cost and outcome.
  A: |
    A planner expanded a 1-4 sentence requirement into a full product spec; a generator implemented feature-by-feature, negotiating sprint contracts; an evaluator used Playwright MCP for real-user interaction testing, scoring across four dimensions (product depth, functionality, visual design, code quality) with hard thresholds that triggered corrective feedback on failure. Total project cost: $124.70 over 3 hours 50 minutes.

- Q: |
    What did analysis of the evaluator's logs reveal in the DAW experiment, and how was it fixed?
  A: |
    Early evaluator versions approved work despite identifiable issues (judgment divergence points). Analyzing the evaluator's logs revealed exactly where judgment diverged from desired quality, and prompt refinement targeting those specific cases produced more reliable scoring.
