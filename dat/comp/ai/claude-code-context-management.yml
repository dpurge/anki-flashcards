- Q: |
    What does the `/init` command do in Claude Code?
  A: |
    Analyzes the entire codebase (purpose/architecture, important commands and critical files, coding patterns and structure) and writes a summary to a CLAUDE.md file.

- Q: |
    What are the three CLAUDE.md file locations Claude Code recognizes, and what is each one for?
  A: |
    `CLAUDE.md` — generated by /init, committed to source control, shared with the team. `CLAUDE.local.md` — not shared, personal instructions/customizations. `~/.claude/CLAUDE.md` — applies to all projects on your machine.

- Q: |
    How do you add an instruction to your CLAUDE.md file without opening and editing it manually?
  A: |
    Type `#` followed by the instruction (e.g. `# Use comments sparingly. Only comment complex code.`) to enter "memory mode" — Claude merges it into the CLAUDE.md file automatically.

- Q: |
    What does typing `@` followed by a path do in a Claude Code prompt?
  A: |
    It's a file mention — Claude includes that file's contents directly in the request. Typing a partial path like `@auth` shows a list of matching files to choose from.

- Q: |
    What is the effect of referencing a file with `@` syntax directly inside CLAUDE.md itself?
  A: |
    That file's contents get automatically included in every request made in the project, so Claude doesn't need to search for and read it each time (e.g. always including a database schema file).

- Q: |
    How do you paste a screenshot into the Claude Code chat interface, and why is this a useful communication technique?
  A: |
    `Ctrl+V` (not `Cmd+V` on macOS). It lets you precisely show Claude which part of the UI you mean before asking for a change to that area.

- Q: |
    How do you enable Planning Mode in Claude Code, and what does it do?
  A: |
    Press `Shift+Tab` twice (once if edits are already auto-accepting). Claude then reads more files, produces a detailed implementation plan, shows it to you, and waits for your approval before making changes.

- Q: |
    List Claude Code's five "thinking" modes from least to most reasoning effort.
  A: |
    Think → Think more → Think a lot → Think longer → Ultrathink. Each successive mode gives Claude progressively more tokens to reason before responding.

- Q: |
    When should you use Planning Mode versus a Thinking mode in Claude Code?
  A: |
    Planning Mode for tasks needing broad codebase understanding or changes spanning multiple files/components. Thinking modes for complex logic problems, debugging, or algorithmic challenges. Both can be combined, at the cost of more tokens.

- Q: |
    What does pressing Escape once do while Claude Code is responding?
  A: |
    Stops Claude mid-response so you can redirect the conversation — e.g. to focus it on one specific task instead of several at once.

- Q: |
    What is the recommended combined workflow for permanently fixing a mistake Claude keeps repeating?
  A: |
    Press Escape to stop the current response, use the `#` shortcut to add a memory describing the correct approach, then continue — this prevents the same error in future conversations on the project.

- Q: |
    What does pressing Escape twice do in Claude Code, and why is it useful?
  A: |
    Rewinds the conversation, showing all sent messages so you can jump back to an earlier point. This drops distracting/irrelevant history (e.g. a long debugging tangent) while keeping the useful context Claude already built up about the codebase.

- Q: |
    What does the `/compact` command do, and when should you use it?
  A: |
    Summarizes the entire conversation history while preserving key learned information. Use it when Claude has gained valuable project knowledge and you want to keep that while moving on to a related task.

- Q: |
    What does the `/clear` command do, and when should you use it?
  A: |
    Completely removes the conversation history for a fresh start. Use it when switching to a fully unrelated task where the prior conversation context might confuse Claude.
