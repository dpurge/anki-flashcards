deck:
  name: 'Language::Semitic::Standard Arabic::Vocabulary'

model:
  name: 'Arabic Vocabulary'
  kind: 'normal'
  style:
    css: ../_model/arab.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      rtl: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: ./bagauddin-1992-vocabulary-pol-latn.csv
    tags: ['bagauddin-1992']
  - filename: ./fietz-2007-vocabulary-pol-latn.csv
    tags: ['fietz-2007']
  - filename: ./hadjadji-1979-vocabulary-pol-latn.csv
    tags: ['hadjadji-1979']
  - filename: ./kurowski-1973-vocabulary-pol-latn.csv
    tags: ['kurowski-1973']
  - filename: ./madina-1999-vocabulary-pol-latn.csv
    tags: ['madina-1999']
  - filename: ./ryding-2005-vocabulary-pol-latn.csv
    tags: ['ryding-2005']
  - filename: ./sharbatov-1998-vocabulary-pol-latn.csv
    tags: ['sharbatov-1998']
  - filename: ./shirwani-2011-vocabulary-pol-latn.csv
    tags: ['shirwani-2011']
