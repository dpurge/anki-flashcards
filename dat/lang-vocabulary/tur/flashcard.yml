deck:
  name: 'Language::Turkic::Turkish::Vocabulary'

model:
  name: 'Turkish Vocabulary'
  kind: 'normal'
  style:
    css: ../_model/latn.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: ./arovina-1971-vocabulary-pol-latn.csv
    tags: ['arovina-1971']
  - filename: ./aylarov-1954-vocabulary-pol-latn.csv
    tags: ['aylarov-1954']
  - filename: ./dudina-2005-vocabulary-pol-latn.csv
    tags: ['dudina-2005']
  - filename: ./guzev-2012-vocabulary-pol-latn.csv
    tags: ['guzev-2012']
  - filename: ./iklim-2015-vocabulary-pol-latn.csv
    tags: ['iklim-2015']
  - filename: ./istanbul-2012-vocabulary-pol-latn.csv
    tags: ['istanbul-2012']
  - filename: ./kabardin-2016-vocabulary-pol-latn.csv
    tags: ['kabardin-2016']
  - filename: ./shcheka-2008-vocabulary-pol-latn.csv
    tags: ['shcheka-2008']
