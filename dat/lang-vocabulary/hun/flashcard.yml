deck:
  name: 'Language::Uralic::Hungarian::Vocabulary'

model:
  name: 'Hungarian Vocabulary'
  kind: 'normal'
  style:
    css: ../_model/latn.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: ./mroczko-1982-vocabulary-pol-latn.csv
    tags: ['mroczko-1982']
  - filename: ./nagy-2015-vocabulary-pol-latn.csv
    tags: ['nagy-2015']
  - filename: ./sandor-1961-vocabulary-pol-latn.csv
    tags: ['sandor-1961']
