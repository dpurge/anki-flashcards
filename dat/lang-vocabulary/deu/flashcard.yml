deck:
  name: 'Language::Germanic::German::Vocabulary'

model:
  name: 'German Vocabulary'
  kind: 'normal'
  style:
    css: ../_model/latn.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: gute-reise-1982-vocabulary-pol-latn.csv
    tags: ['gute-reise-1982']
  - filename: nikiel-1976-vocabulary-pol-latn.csv
    tags: ['nikiel-1976']
  - filename: listvin-2016-vocabulary-pol-latn.csv
    tags: ['listvin-2016']
  - filename: noskov-2017-vocabulary-pol-latn.csv
    tags: ['noskov-2017']
