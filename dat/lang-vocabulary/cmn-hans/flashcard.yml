deck:
  name: 'Language::Sino-Tibetan::Mandarin::Vocabulary (Simplified)'

model:
  name: 'Mandarin Vocabulary (Simplified)'
  kind: 'normal'
  style:
    css: ../_model/hans.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: ./boya-2013-vocabulary-pol-latn.csv
    tags: ['boya-2013']
  - filename: ./npcr-2019-vocabulary-pol-latn.csv
    tags: ['npcr-2019']
  - filename: ./schaum-2002-vocabulary-pol-latn.csv
    tags: ['schaum-2002']
