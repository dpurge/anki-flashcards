deck:
  name: 'Language::Austronesian::Indonesian::Vocabulary'

model:
  name: 'Indonesian Vocabulary'
  kind: 'normal'
  style:
    css: ../_model/latn.css
  templates:
    - name: Recognize
      qfmt: ../_model/recognize-qfmt.html
      afmt: ../_model/recognize-afmt.html
    - name: Recall
      qfmt: ../_model/recall-qfmt.html
      afmt: ../_model/recall-afmt.html
  fields:
    - name: Phrase
      template: ../_template/Phrase.txt
      index: true
      description: Phrase
    - name: Grammar
      template: ../_template/Grammar.txt
      index: true
      description: Grammar
    - name: Transcription
      template: ../_template/Transcription.txt
      description: Transcription
    - name: Translation
      template: ../_template/Translation.txt
      merge: true
      description: Translation
    - name: Notes
      template: ../_template/Notes.txt
      format: markdown
      description: Notes

audio: []
video: []
image: []

data:
  - filename: ./colloquial-2002-vocabulary-pol-latn.csv
    tags: ['colloquial-2002']
  - filename: ./demidyuk-2013-vocabulary-pol-latn.csv
    tags: ['demidyuk-2013']
  - filename: ./indonesian-way-vocabulary-pol-latn.csv
    tags: ['indonesian-way']
  - filename: ./linguaphone-vocabulary-pol-latn.csv
    tags: ['linguaphone']
  - filename: ./soravia-2002-vocabulary-pol-latn.csv
    tags: ['soravia-2002']
