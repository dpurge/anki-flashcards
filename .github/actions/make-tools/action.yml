name: Make tools
description: Prepare tools for the build

inputs:
  python-version:
    description: Python version
    required: true
    default: 3.12
  uv-version:
    description: Astral uv version
    required: true
    default: latest

outputs:
  version:
    description: Version for artifacts
    value: ${{ steps.version.outputs.version }}


runs:
  using: composite
  steps:

  - name: Install Python
    uses: actions/setup-python@v5
    with:
      python-version: ${{ inputs.python-version }}

  - name: Install uv
    uses: astral-sh/setup-uv@v4
    with:
      version: ${{ inputs.uv-version }}

  - name: Set version
    id: version
    shell: bash
    run: |
      version=$(uv version | cut -d ' ' -f 2)-$(git rev-parse --short HEAD)
      echo "version=${version}" >> "${GITHUB_OUTPUT}"
