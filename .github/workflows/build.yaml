name: build

on:
    workflow_dispatch:
        inputs:
            arb:
                description: Arabic
                type: boolean
                required: true
                default: false

env:
    PYTHON_VERSION: 3.12
    UV_VERSION: latest

jobs:

    build:

        runs-on: [ubuntu-latest]

        steps:

        -   name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

        -   name: Install Python
            uses: actions/setup-python@v5
            with:
                python-version: ${{ env.PYTHON_VERSION }}

        -   name: Install uv
            uses: astral-sh/setup-uv@v4
            with:
                version: ${{ env.UV_VERSION }}
