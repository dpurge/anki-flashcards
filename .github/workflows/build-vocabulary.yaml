name: build-vocabulary

on:
    workflow_dispatch:
        inputs:
            language:
                description: List of languages
                required: true

env:
    PYTHON_VERSION: 3.12
    UV_VERSION: latest

permissions:
  contents: write

jobs:

    build:

        runs-on: [ubuntu-latest]

        steps:

        -   name: Checkout
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

        -   name: Make tools
            id: tools
            uses: ./.github/actions/make-tools

        -   name: Arabic (Syrian) vocabulary
            if: ${{ contains(inputs.language, 'apc') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/apc/flashcard.yml
                output-apkg: out/syrian-arabic-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Arabic (Standard) vocabulary
            if: ${{ contains(inputs.language, 'arb') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/arb/flashcard.yml
                output-apkg: out/arabic-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Arabic (Egyptian) vocabulary
            if: ${{ contains(inputs.language, 'arz') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/arz/flashcard.yml
                output-apkg: out/egyptian-arabic-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Bulgarian vocabulary
            if: ${{ contains(inputs.language, 'bul') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/bul/flashcard.yml
                output-apkg: out/bulgarian-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Czech vocabulary
            if: ${{ contains(inputs.language, 'ces') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/ces/flashcard.yml
                output-apkg: out/czech-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Mandarin Chinese (Simplified) vocabulary
            if: ${{ contains(inputs.language, 'cmn-hans') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/cmn-hans/flashcard.yml
                output-apkg: out/mandarin-chinese-simplified-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Mandarin Chinese (Traditional) vocabulary
            if: ${{ contains(inputs.language, 'cmn-hant') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/cmn-hant/flashcard.yml
                output-apkg: out/mandarin-chinese-traditional-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: German vocabulary
            if: ${{ contains(inputs.language, 'deu') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/deu/flashcard.yml
                output-apkg: out/german-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Modern Greek vocabulary
            if: ${{ contains(inputs.language, 'ell') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/ell/flashcard.yml
                output-apkg: out/modern-greek-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Esperanto vocabulary
            if: ${{ contains(inputs.language, 'epo') }}
