        -   name: Tajik vocabulary
            if: ${{ contains(inputs.language, 'tgk') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/tgk/flashcard.yml
                output-apkg: out/tajik-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Turkish vocabulary
            if: ${{ contains(inputs.language, 'tur') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/tur/flashcard.yml
                output-apkg: out/turkish-vocabulary-${{ steps.tools.outputs.version }}.apkg

        -   name: Ukrainian vocabulary
            if: ${{ contains(inputs.language, 'ukr') }}
            uses: ./.github/actions/build-vocabulary
            with:
                input-project: dat/lang-vocabulary/ukr/flashcard.yml
