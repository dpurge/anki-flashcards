- Task: |
    - Utwórz trzy pod-y: nginx1, nginx2, nginx3
    - Wszystkie pod-y powinny mieć labelkę `app=v1`
  Code: |
    for i in `seq 1 3`;
    do kubectl run nginx$i --image=nginx -l app=v1 ;
    done
- Task: |
    Wyświetl pod-y i ich labelki
  Code: |
    kubectl get po \
      --show-labels
- Task: |
    Zamień labelkę pod-a `nginx2` na `app=v2`
  Code: |
    kubectl label \
      po nginx2 \
        app=v2 --overwrite
- Task: |
    Wyświetl pod-y i labelkę `app`
  Code: |
    kubectl get po \
      --label-columns=app
- Task: |
    Wyświetl tylko pod-y z labelką `app=v2`
  Code: |
    # Sposób 1
    kubectl get po -l app=v2

    # Sposób 2
    kubectl get po -l 'app in (v2)'

    # Sposób 3
    kubectl get po --selector=app=v2
- Task: |
    Dodaj nową labelkę `tier=web` do wszystkich pod-ów z labelkami `app=v1` lub `app=v2`
  Code: |
    kubectl label po \
      -l "app in(v1,v2)" tier=web
- Task: |
    Dodaj adnotację `owner: marketing` do wszystkich pod-ów z labelką `app=v2`
  Code: |
    kubectl annotate po \
      -l "app=v2" owner=marketing
- Task: |
    Usuń labelkę `app` z pod-ów: nginx1, nginx2, nginx3
  Code: |
    # Sposób 1
    kubectl label po \
      nginx1 nginx2 nginx3 \
        app-

    # Sposób 2
    kubectl label po \
      nginx{1..3} app-

    # Sposób 3
    kubectl label po \
      -l app app-
- Task: |
    Dodaj adnotację do podów nginx1, nginx2, nginx3: `description='my description'`
  Code: |
    kubectl annotate po \
      nginx{1..3} \
        description='my description'
- Task: |
    Wyświetl adnotacje pod-a nginx1
  Code: |
    # Sposób 1
    kubectl annotate pod \
      nginx1 --list

    # Sposób 2
    kubectl describe po \
      nginx1 | grep -i 'annotations'

    # Sposób 3
    kubectl get po nginx1 \
      -o jsonpath='{.metadata.annotations}{"\n"}'

    # Sposób 4
    kubectl get po nginx1 \
      -o custom-columns=Name:metadata.name,ANNOTATIONS:metadata.annotations.description
- Task: |
    Usuń adnotacje `description` i `owner` z podów: nginx1, nginx2, nginx3
  Code: |
    kubectl annotate po \
      nginx{1..3} \
        description- owner-
- Task: |
    Usuń pody: nginx1, nginx2, nginx3
  Code: |
    kubectl delete \
      po nginx{1..3}
